openapi: 3.0.3
info:
  title: BookNest API
  description: RESTful OpenAPI 3.0 specification for the BookNest platform, supporting catalogue exploration, cart operations, gift points redemption, order processing, and history-based recommendations.
  version: 1.0.0
servers:
  - url: http://127.0.0.1:3000/api/v1
    description: Local Development Server

paths:
  /auth/login:
    post:
      summary: Authenticate with email and password; returns a short-lived JWT
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request body
        '401':
          description: Invalid email or password
        '429':
          description: Too many login attempts (5 per minute)

  /auth/guest:
    post:
      summary: Start an anonymous guest session so a visitor can add to cart and check out
      tags: [Authentication]
      security: []
      responses:
        '201':
          description: Guest session created (isGuest = true, 0 points)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '429':
          description: Too many requests (10 per minute)

  /auth/me:
    get:
      summary: Get the authenticated user profile
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Missing, invalid or expired token

  /categories:
    get:
      summary: List all book categories
      tags: [Catalogue]
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

  /brands:
    get:
      summary: List all publisher brands
      tags: [Catalogue]
      responses:
        '200':
          description: List of brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Brand'

  /books:
    get:
      summary: Query books catalogue with filtering
      tags: [Catalogue]
      parameters:
        - name: categoryId
          in: query
          schema:
            type: string
        - name: categorySlug
          in: query
          schema:
            type: string
        - name: brandId
          in: query
          schema:
            type: string
        - name: brandSlug
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: isAvailable
          in: query
          schema:
            type: boolean
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [price_asc, price_desc, rating_desc, newest]
      responses:
        '200':
          description: Matching books array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /books/{id}:
    get:
      summary: Get book details by ID
      tags: [Catalogue]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Book details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: Book not found

  /books/{id}/related:
    get:
      summary: Get related books based on category or publisher
      tags: [Catalogue]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 4
      responses:
        '200':
          description: List of related books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /recommendations/order-history:
    get:
      security:
        - bearerAuth: []
      summary: Get recommended books tailored from past order history
      tags: [Recommendations]
      responses:
        '200':
          description: Recommended books for user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /cart:
    get:
      security:
        - bearerAuth: []
      summary: Get current user shopping cart
      tags: [Cart]
      responses:
        '200':
          description: User cart items with subtotal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
    post:
      security:
        - bearerAuth: []
      summary: Add an item to shopping cart
      tags: [Cart]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartDto'
      responses:
        '201':
          description: Item added to cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
    delete:
      security:
        - bearerAuth: []
      summary: Clear entire cart
      tags: [Cart]
      responses:
        '200':
          description: Cart cleared

  /cart/{id}:
    patch:
      security:
        - bearerAuth: []
      summary: Update cart item quantity
      tags: [Cart]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Cart item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
    delete:
      security:
        - bearerAuth: []
      summary: Remove item from cart
      tags: [Cart]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item removed

  /users/profile:
    get:
      security:
        - bearerAuth: []
      summary: Get active user profile with points balance
      tags: [User]
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /addresses:
    get:
      security:
        - bearerAuth: []
      summary: Get user delivery addresses
      tags: [Checkout]
      responses:
        '200':
          description: List of delivery addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
    post:
      security:
        - bearerAuth: []
      summary: Create new delivery address
      tags: [Checkout]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressDto'
      responses:
        '201':
          description: Created address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'

  /addresses/{id}:
    patch:
      security:
        - bearerAuth: []
      summary: Edit one of the user's saved delivery addresses
      description: Only the fields that are sent are changed. Setting isDefault to true clears the default flag on the user's other addresses.
      tags: [Checkout]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAddressDto'
      responses:
        '200':
          description: Updated address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          description: Invalid or unknown field, or the id is not a UUID
        '404':
          description: The address does not exist or belongs to another user

  /checkout/calculate:
    post:
      security:
        - bearerAuth: []
      summary: Calculate checkout total with gift points deduction
      tags: [Checkout]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateCheckoutDto'
      responses:
        '200':
          description: Pricing calculation breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutCalculationResponse'

  /checkout/process:
    post:
      security:
        - bearerAuth: []
      summary: Complete purchase and initiate payment
      tags: [Checkout]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessOrderDto'
      responses:
        '201':
          description: Purchase completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderConfirmationResponse'

  /orders:
    get:
      security:
        - bearerAuth: []
      summary: List user past orders
      tags: [Orders]
      responses:
        '200':
          description: List of orders with items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /orders/{id}:
    get:
      security:
        - bearerAuth: []
      summary: Get order details by ID
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /orders/{id}/buy-again:
    post:
      security:
        - bearerAuth: []
      summary: Re-add all items from past order to cart
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Items re-added to basket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'

  /orders/{id}/cancel:
    post:
      security:
        - bearerAuth: []
      summary: Cancel a completed order within 48 hours
      description: >
        Sets the order to CANCELLED, restocks the books, records a REFUNDED payment transaction
        and reverses the gift points earned and redeemed on the order.
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order cancelled and refunded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReversalResponse'
        '400':
          description: Order is not COMPLETED or is outside the 48-hour cancel window
        '401':
          description: Missing or invalid token
        '404':
          description: Order not found for the signed-in user

  /orders/{id}/return:
    post:
      security:
        - bearerAuth: []
      summary: Return a completed order between 48 hours and 30 days after purchase
      description: >
        Sets the order to RETURNED, restocks the books, records a REFUNDED payment transaction
        and reverses the gift points earned and redeemed on the order.
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order returned and refunded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReversalResponse'
        '400':
          description: Order is not COMPLETED or is outside the return window
        '401':
          description: Missing or invalid token
        '404':
          description: Order not found for the signed-in user

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginDto:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 180
        password:
          type: string
          maxLength: 128
          format: password
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        user:
          $ref: '#/components/schemas/User'
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        icon:
          type: string

    Brand:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        logoUrl:
          type: string

    Book:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: string
        isbn:
          type: string
        price:
          type: number
        stockQuantity:
          type: integer
        isAvailable:
          type: boolean
        coverImage:
          type: string
        description:
          type: string
        rating:
          type: number
        numReviews:
          type: integer
        format:
          type: string
        tags:
          type: array
          items:
            type: string
        category:
          $ref: '#/components/schemas/Category'
        brand:
          $ref: '#/components/schemas/Brand'

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        rewardPoints:
          type: integer
        isGuest:
          type: boolean
          description: True for anonymous guest-checkout sessions

    Address:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        street:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        country:
          type: string
        isDefault:
          type: boolean

    CreateAddressDto:
      type: object
      required: [fullName, street, city, state, zipCode]
      properties:
        fullName:
          type: string
        street:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        country:
          type: string
        isDefault:
          type: boolean

    UpdateAddressDto:
      type: object
      description: Every property is optional; a property that is sent must not be empty.
      properties:
        fullName:
          type: string
          maxLength: 120
        street:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        zipCode:
          type: string
          maxLength: 20
        country:
          type: string
          maxLength: 80
        isDefault:
          type: boolean

    AddToCartDto:
      type: object
      required: [bookId]
      properties:
        bookId:
          type: string
        quantity:
          type: integer
          default: 1

    CartItem:
      type: object
      properties:
        id:
          type: string
        bookId:
          type: string
        quantity:
          type: integer
        book:
          $ref: '#/components/schemas/Book'

    CartResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        totalItems:
          type: integer
        subtotal:
          type: number

    CalculateCheckoutDto:
      type: object
      properties:
        redeemPoints:
          type: integer
          default: 0

    CheckoutCalculationResponse:
      type: object
      properties:
        subtotal:
          type: number
        pointsAvailable:
          type: integer
        pointsRedeemed:
          type: integer
        discountAmount:
          type: number
        shippingAmount:
          type: number
        taxAmount:
          type: number
        finalTotal:
          type: number

    ProcessOrderDto:
      type: object
      required: [addressId, paymentMethod]
      properties:
        addressId:
          type: string
        email:
          type: string
          format: email
          maxLength: 180
          description: Contact email for the order (used for guest checkout)
        paymentMethod:
          type: string
          enum: [CREDIT_CARD, PAYPAL, APPLE_PAY, GOOGLE_PAY, SEPA_DIRECT_DEBIT, IDEAL, SOFORT, BANCONTACT, GIFT_POINTS_FULL]
        redeemPoints:
          type: integer
          default: 0
        paymentDetails:
          type: object
          properties:
            cardNumber:
              type: string
            cardHolder:
              type: string
            expiryDate:
              type: string
            cvv:
              type: string

    Order:
      type: object
      properties:
        id:
          type: string
        orderNumber:
          type: string
        totalAmount:
          type: number
        discountAmount:
          type: number
        pointsRedeemed:
          type: integer
        finalAmount:
          type: number
        paymentMethod:
          type: string
        status:
          type: string
          enum: [PENDING, COMPLETED, CANCELLED, RETURNED]
        createdAt:
          type: string
        canCancel:
          type: boolean
          description: True while a COMPLETED order is within 48 hours of purchase.
        canReturn:
          type: boolean
          description: True for a COMPLETED order between 48 hours and 30 days after purchase.
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        address:
          $ref: '#/components/schemas/Address'

    OrderItem:
      type: object
      properties:
        id:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
        totalPrice:
          type: number
        book:
          $ref: '#/components/schemas/Book'

    OrderConfirmationResponse:
      type: object
      properties:
        success:
          type: boolean
        orderId:
          type: string
        orderNumber:
          type: string
        message:
          type: string
        finalAmount:
          type: number
        pointsRedeemed:
          type: integer
        remainingPoints:
          type: integer
        order:
          $ref: '#/components/schemas/Order'

    OrderReversalResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        refundAmount:
          type: number
        pointsAdjustment:
          type: integer
          description: Net change applied to the gift-point balance (redeemed points returned, earned points removed).
        order:
          $ref: '#/components/schemas/Order'

